<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org" data-theme="modern">
<head th:replace="~{layout :: head('登录')}"></head>
<body>
<div class="d-flex align-items-center justify-content-center" style="min-height: 100vh;">
    <div class="card" style="max-width: 400px; width: 100%;">
        <div class="card-body p-4">
            <div class="text-center mb-4">
                <h3 class="mb-1">🚀 API Scheduler</h3>
                <p class="text-muted mb-0">轻量级任务调度系统</p>
            </div>

            <div th:if="${error}" class="alert alert-danger py-2" role="alert">
                <small th:text="${error}">用户名或密码错误</small>
            </div>

            <form th:action="@{/web/auth/login}" method="post">
                <div class="mb-3">
                    <label for="username" class="form-label">用户名</label>
                    <div class="input-group">
                        <span class="input-group-text">👤</span>
                        <input type="text" class="form-control" id="username" name="username"
                               th:value="${username}" placeholder="请输入用户名" required autofocus>
                    </div>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">密码</label>
                    <div class="input-group">
                        <span class="input-group-text">🔒</span>
                        <input type="password" class="form-control" id="password" name="password"
                               placeholder="请输入密码" required>
                    </div>
                </div>
                <div class="d-grid">
                    <button type="submit" class="btn btn-primary">登录</button>
                </div>
            </form>

            <div class="text-center mt-3">
                <small class="text-muted">默认账号：admin / admin123</small>
            </div>

            <div class="text-center mt-4">
                <a href="https://github.com/moshowgame/springboot-api-scheduler" target="_blank"
                   class="btn btn-outline-dark btn-sm me-2">GitHub</a>
                <a href="https://zhengkai.blog.csdn.net/" target="_blank"
                   class="btn btn-outline-danger btn-sm">CSDN</a>
            </div>
        </div>
    </div>
</div>
<div th:replace="~{layout :: scripts}"></div>
</body>
</html>
