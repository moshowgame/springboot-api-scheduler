<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<body>

<!-- ==================== 任务新建 / 编辑表单 ==================== -->
<div th:fragment="modalContent">
    <div class="modal-header">
        <h5 class="modal-title" th:text="${task != null and task.id != null} ? '编辑任务' : '新建任务'">新建任务</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="关闭"></button>
    </div>
    <form hx-post="/web/tasks/save" hx-target="#taskTable" hx-swap="outerHTML">
        <div class="modal-body">
            <input type="hidden" name="id" th:value="${task?.id}">

            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">任务名称 <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" name="taskName" required
                           th:value="${task?.taskName}" placeholder="例如：健康检查">
                </div>
                <div class="col-md-3">
                    <label class="form-label">请求方法</label>
                    <select class="form-select" name="method">
                        <option th:each="m : ${ {'GET','POST','PUT','DELETE','PATCH'} }"
                                th:value="${m}" th:text="${m}"
                                th:selected="${task?.method == m}">GET</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label">超时(秒)</label>
                    <input type="number" class="form-control" name="timeout" min="1"
                           th:value="${task?.timeout} ?: 30">
                </div>

                <div class="col-12">
                    <label class="form-label">请求地址 <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" name="url" required
                           th:value="${task?.url}" placeholder="https://example.com/api/health">
                </div>

                <div class="col-12" th:attr="x-data=|{ cron: '${task?.cronExpression ?: ''}' }|">
                    <label class="form-label">Cron 表达式</label>
                    <div class="input-group">
                        <input type="text" class="form-control" name="cronExpression" x-model="cron"
                               placeholder="0 0/5 * * * ?">
                        <button type="button" class="btn btn-outline-secondary" @click="cron = ''">清除</button>
                    </div>

                    <!-- Cron 快速选择助手：点击常用表达式直接应用 -->
                    <div class="cron-helper mt-2">
                        <div class="cron-helper-title">⚡ 常用检测频率（点击快速应用）</div>
                        <div class="d-flex flex-wrap gap-2">
                            <button type="button" class="cron-chip" @click="cron = '0 * * * * ?'"
                                    :class="{active: cron === '0 * * * * ?'}">每分钟</button>
                            <button type="button" class="cron-chip" @click="cron = '0 0/5 * * * ?'"
                                    :class="{active: cron === '0 0/5 * * * ?'}">每 5 分钟</button>
                            <button type="button" class="cron-chip" @click="cron = '0 0/30 * * * ?'"
                                    :class="{active: cron === '0 0/30 * * * ?'}">每 30 分钟</button>
                            <button type="button" class="cron-chip" @click="cron = '0 0 * * * ?'"
                                    :class="{active: cron === '0 0 * * * ?'}">每小时</button>
                            <button type="button" class="cron-chip" @click="cron = '0 0 0/6 * * ?'"
                                    :class="{active: cron === '0 0 0/6 * * ?'}">每 6 小时</button>
                            <button type="button" class="cron-chip" @click="cron = '0 0 8 * * ?'"
                                    :class="{active: cron === '0 0 8 * * ?'}">每天 8 点</button>
                            <button type="button" class="cron-chip" @click="cron = '0 0 8,12,20 * * ?'"
                                    :class="{active: cron === '0 0 8,12,20 * * ?'}">每天 8/12/20 点</button>
                            <button type="button" class="cron-chip" @click="cron = '0 0 9-18 ? * MON-FRI'"
                                    :class="{active: cron === '0 0 9-18 ? * MON-FRI'}">工作日 9-18 点每小时</button>
                            <button type="button" class="cron-chip" @click="cron = '0 0 9 ? * MON'"
                                    :class="{active: cron === '0 0 9 ? * MON'}">每周一 9 点</button>
                            <button type="button" class="cron-chip" @click="cron = '0 0 0 1 * ?'"
                                    :class="{active: cron === '0 0 0 1 * ?'}">每月 1 号 0 点</button>
                        </div>
                        <div class="cron-helper-note small text-muted">
                            6 位格式：<code>秒 分 时 日 月 周</code>，"日"与"周"不可同时指定，另一个用 <code>?</code> 占位；留空或格式非法时任务不会被定时调度，仍可手动执行。
                        </div>
                    </div>
                </div>
                <div class="col-12">
                    <label class="form-label">描述</label>
                    <input type="text" class="form-control" name="description"
                           th:value="${task?.description}" placeholder="可选">
                </div>

                <div class="col-md-6">
                    <label class="form-label">请求头 (JSON)</label>
                    <textarea class="form-control" name="headers" rows="3"
                              th:text="${task?.headers}" placeholder='{"Content-Type":"application/json"}'></textarea>
                </div>
                <div class="col-md-6">
                    <label class="form-label">请求参数 (JSON)</label>
                    <textarea class="form-control" name="parameters" rows="3"
                              th:text="${task?.parameters}" placeholder='{"key":"value"}'></textarea>
                </div>
            </div>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
            <button type="submit" class="btn btn-primary">保存</button>
        </div>
    </form>
</div>

</body>
</html>
