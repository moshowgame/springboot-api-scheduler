<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' - API Scheduler'">API Scheduler</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/themes.css}" rel="stylesheet">
    <script>
        // 尽早应用主题，避免闪烁
        (function () {
            var t = 'modern';
            try { t = localStorage.getItem('theme') || 'modern'; } catch (e) { /* ignore */ }
            document.documentElement.setAttribute('data-theme', t);
        })();
    </script>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
</head>
<body>

<!-- ==================== 顶部导航栏 ==================== -->
<nav th:fragment="navbar(active)" class="navbar navbar-expand-lg navbar-dark">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/dashboard}">🚀 SpringBoot-API-Scheduler</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar"
                aria-controls="mainNavbar" aria-expanded="false" aria-label="切换导航">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNavbar">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/dashboard}"
                       th:classappend="${active == 'dashboard'} ? 'active' : ''">📊 数据统计</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/tasks}"
                       th:classappend="${active == 'tasks'} ? 'active' : ''">📋 任务管理</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/logs}"
                       th:classappend="${active == 'logs'} ? 'active' : ''">📜 执行日志</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/alerts}"
                       th:classappend="${active == 'alerts'} ? 'active' : ''">🔔 警报记录</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/assertions}"
                       th:classappend="${active == 'assertions'} ? 'active' : ''">✅ 断言配置</a>
                </li>
            </ul>
            <div class="theme-switcher me-lg-3 my-2 my-lg-0" x-data>
                <button type="button" class="theme-btn theme-modern"
                        :class="{ active: $store.theme.current === 'modern' }"
                        @click="$store.theme.set('modern')">🖥️ 现代化</button>
                <button type="button" class="theme-btn theme-mario"
                        :class="{ active: $store.theme.current === 'mario' }"
                        @click="$store.theme.set('mario')">🍄 马里奥</button>
            </div>
            <div class="d-flex align-items-center text-white">
                <span class="me-3" th:text="${session.user} ?: '游客'">用户</span>
                <a class="btn btn-sm btn-outline-light" th:href="@{/logout}">退出</a>
            </div>
        </div>
    </div>
</nav>

<!-- ==================== 全局脚本 ==================== -->
<div th:fragment="scripts">
    <div id="app-toast-container" class="position-fixed top-0 end-0 p-3" style="z-index: 2000;"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // ---- Alpine: 主题 store ----
        document.addEventListener('alpine:init', function () {
            Alpine.store('theme', {
                current: localStorage.getItem('theme') || 'modern',
                set: function (t) {
                    this.current = t;
                    try { localStorage.setItem('theme', t); } catch (e) { /* ignore */ }
                    document.documentElement.setAttribute('data-theme', t);
                }
            });
        });

        // ---- 全局 Toast ----
        window.appToast = function (message, type) {
            if (!message) return;
            var container = document.getElementById('app-toast-container');
            if (!container) return;
            var el = document.createElement('div');
            el.className = 'alert alert-' + (type || 'success') + ' shadow-sm mb-2';
            el.setAttribute('role', 'alert');
            el.textContent = message;
            container.appendChild(el);
            setTimeout(function () { el.remove(); }, 3000);
        };

        // ---- 关闭当前打开的模态框 ----
        window.appCloseModal = function () {
            document.querySelectorAll('.modal.show').forEach(function (el) {
                var m = bootstrap.Modal.getInstance(el);
                if (m) { m.hide(); }
            });
        };

        // ---- HTMX 请求错误统一处理 ----
        document.body.addEventListener('htmx:responseError', function (evt) {
            var xhr = evt.detail.xhr;
            if (xhr.status === 401) {
                window.location.href = '/login';
            } else {
                window.appToast('请求失败：' + xhr.status, 'danger');
            }
        });

    </script>
</div>

</body>
</html>
